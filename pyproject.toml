[project]
name = "narrative-latency-tw"
version = "0.1.0"
description = "How fast does Taiwan's Cofacts community fact-check LINE rumors, and how has that changed across election cycles?"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Natalia Harzu" }]

# Core analysis stack — everything scripts 01–04 + the test suite need.
dependencies = [
    "pandas>=2.0",
    "numpy",
    "scipy>=1.11",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
# Streamlit dashboard runtime. Mirrors requirements.txt (used by Streamlit Cloud).
app = [
    "streamlit>=1.30",
    "plotly>=5.18",
]
# Heavy embedding + clustering stack — only needed by scripts/05_cluster_articles.py.
ml = [
    "scikit-learn",
    "sentence-transformers",
    "torch",
    "umap-learn",
    "hdbscan",
]
# Notebook authoring / jupytext sync.
notebooks = [
    "jupyter",
    "jupytext",
]

[dependency-groups]
# Installed by default on `uv sync`; kept out of the published deps.
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/narrative_latency"]

[tool.uv]
# Streamlit Community Cloud resolves dependencies with uv whenever a uv.lock
# is present, and a plain `uv sync` installs only the core deps + the dev
# group — it does NOT install optional-dependency extras. That left the
# deployed dashboard without plotly/streamlit (ModuleNotFoundError at
# `import plotly.express`). Installing the `app` extra by default fixes the
# Cloud deploy while keeping the optional-dependencies layout intact:
# `uv sync --extra app` and `uv sync --extra ml` still work as before.
default-extras = ["app"]

[tool.pytest.ini_options]
# Make the src/ package importable in tests without requiring an editable install.
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-v"
