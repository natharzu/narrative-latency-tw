[project]
name = "narrative-latency-tw"
version = "0.1.0"
description = "How fast does Taiwan's Cofacts community fact-check LINE rumors, and how has that changed across election cycles?"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Natalia Harzu" }]

# Core analysis stack — everything scripts 01–04 + the test suite need.
dependencies = [
    "pandas>=2.0",
    "numpy",
    "scipy>=1.11",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
# Heavy embedding + clustering stack — only needed by scripts/05_cluster_articles.py.
ml = [
    "scikit-learn",
    "sentence-transformers",
    "torch",
    "umap-learn",
    "hdbscan",
]
# Notebook authoring / jupytext sync.
notebooks = [
    "jupyter",
    "jupytext",
]

[dependency-groups]
# Installed by default on `uv sync` (see [tool.uv] default-groups); kept out of
# the published package metadata.
dev = [
    "pytest>=8.0",
]
# Streamlit dashboard runtime for local `streamlit run`. The deployed dashboard
# on Streamlit Community Cloud installs from app/requirements.txt, not from here.
app = [
    "streamlit>=1.30",
    "plotly>=5.18",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/narrative_latency"]

[tool.uv]
# Install the dev + app dependency groups by default on a plain `uv sync`, so a
# fresh clone (and the CI runner) gets pytest and the Streamlit runtime without
# extra flags. Using dependency groups instead of `default-extras` keeps this
# compatible across uv versions — older uv rejects the `default-extras` key.
# The ml / notebooks extras stay opt-in via `uv sync --extra ml` etc.
default-groups = ["dev", "app"]

[tool.pytest.ini_options]
# Make the src/ package importable in tests without requiring an editable install.
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-v"
